name: Deploy GitHub Actions (rsync)
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Exact 40-character main commit SHA already validated by CI"
        required: true
      bootstrap:
        description: "Create the persistent environment from VPS_ENV_FILE only if absent"
        type: boolean
        default: false
concurrency:
  group: deploy-production
  cancel-in-progress: false
permissions:
  actions: read
  contents: read
jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: ${{ inputs.sha }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_DIR: ${{ secrets.VPS_DIR }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_FINGERPRINT: ${{ secrets.VPS_SSH_FINGERPRINT }}
      VPS_HEALTH_URL: ${{ secrets.VPS_HEALTH_URL }}
      VPS_FPM_SERVICE: ${{ vars.VPS_FPM_SERVICE }}
      VPS_PHP_BINARY: ${{ vars.VPS_PHP_BINARY || '/usr/bin/php' }}
      VPS_ENV_FILE: ${{ secrets.VPS_ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify signed local preparation and exact main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 bin/github-delivery.py stage --sha "$TARGET_SHA" --kind deploy --directory "$RUNNER_TEMP/delivery"
          python3 bin/delivery.py extract-runtime --directory "$RUNNER_TEMP/delivery" --output "$RUNNER_TEMP/project-runtime"
      - name: Smoke the prepared runtime without building or installing
        run: |
          docker run --rm --network none --volume "$RUNNER_TEMP/project-runtime:/app" --workdir /app \
            --env APP_ENV=production --env APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            --env DB_CONNECTION=sqlite --env DB_DATABASE=:memory: --env SESSION_DRIVER=file \
            --env CACHE_STORE=file --env QUEUE_CONNECTION=sync --entrypoint php composer:2 artisan --version
      - name: Require the GitHub Actions deployment profile
        run: jq -e '.deployment == "github-actions"' "$RUNNER_TEMP/project-runtime/cms-project.json"
      - name: Validate destination and pin SSH host
        run: |
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]] && ((10#$VPS_PORT > 0 && 10#$VPS_PORT <= 65535))
          [[ "$VPS_DIR" =~ ^/[a-zA-Z0-9_./-]+$ ]] && [ "$VPS_DIR" != / ] && [[ "$VPS_DIR/" != */../* ]]
          [[ "$VPS_PHP_BINARY" =~ ^/[a-zA-Z0-9_./-]+$ ]]
          test -n "$VPS_SSH_KEY" && test -n "$VPS_SSH_FINGERPRINT"
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -T 10 -t ed25519 -p "$VPS_PORT" "$VPS_HOST" > ~/.ssh/known_hosts
          test "$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}' | sort -u)" = "$VPS_SSH_FINGERPRINT"
          echo "RELEASE_NAME=release-$(date -u +%Y%m%d%H%M%S)-${TARGET_SHA}" >> "$GITHUB_ENV"
      - name: Transfer the directory through rsync
        run: |
          printf -v prepare 'mkdir -p %q/releases; test ! -e %q/releases/%q; mkdir %q/releases/%q' "$VPS_DIR" "$VPS_DIR" "$RELEASE_NAME" "$VPS_DIR" "$RELEASE_NAME"
          ssh -p "$VPS_PORT" -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "$prepare"
          rsync -rlptz --delete --chmod=Du=rwx,Dgo=rx,Fu=rwX,Fgo=rX -e "ssh -p $VPS_PORT -o StrictHostKeyChecking=yes" "$RUNNER_TEMP/project-runtime/" "$VPS_USER@$VPS_HOST:$VPS_DIR/releases/$RELEASE_NAME/"
      - name: Bootstrap persistent configuration when explicitly requested
        if: inputs.bootstrap == true
        run: |
          test -n "$VPS_ENV_FILE"
          printf -v bootstrap 'env VPS_DIR=%q bash %q' "$VPS_DIR" "$VPS_DIR/releases/$RELEASE_NAME/bin/vps-bootstrap.sh"
          printf '%s' "$VPS_ENV_FILE" | ssh -p "$VPS_PORT" -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "$bootstrap"
      - name: Promote using the VPS PHP CLI
        run: |
          printf -v remote 'env VPS_DIR=%q RELEASE_NAME=%q VPS_DEPLOYMENT_PROFILE=github-actions VPS_PHP_BINARY=%q VPS_HEALTH_URL=%q VPS_FPM_SERVICE=%q bash %q %q' "$VPS_DIR" "$RELEASE_NAME" "$VPS_PHP_BINARY" "$VPS_HEALTH_URL" "$VPS_FPM_SERVICE" "$VPS_DIR/releases/$RELEASE_NAME/bin/deploy-vps-release.sh" "$VPS_DIR/releases/$RELEASE_NAME"
          ssh -p "$VPS_PORT" -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "$remote"
