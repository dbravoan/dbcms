name: Deploy GitHub Actions (rsync)
on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: "Exact 40-character main commit SHA already validated by CI"
        required: true
      bootstrap:
        description: "Create the persistent environment from VPS_ENV_FILE only if absent"
        type: boolean
        default: false
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false
permissions:
  actions: read
  contents: read
jobs:
  verify-ci:
    name: Verify Exact Main CI
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      target_sha: ${{ steps.candidate.outputs.target_sha }}
    steps:
      - name: Resolve immutable deployment candidate
        id: candidate
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event || '' }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          REQUESTED_SHA: ${{ inputs.sha || '' }}
        run: |
          if [ "$EVENT_NAME" = workflow_run ]; then
            test "$WORKFLOW_RUN_BRANCH" = main
            test "$WORKFLOW_RUN_EVENT" = push
            test "$WORKFLOW_RUN_CONCLUSION" = success
            target_sha="$WORKFLOW_RUN_SHA"
          else
            target_sha="$REQUESTED_SHA"
          fi
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "target_sha=${target_sha}" >> "$GITHUB_OUTPUT"

      - name: Require successful CI push for exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.candidate.outputs.target_sha }}
        run: |
          response="$(curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --get "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            --data-urlencode "branch=main" \
            --data-urlencode "event=push" \
            --data-urlencode "status=success" \
            --data-urlencode "head_sha=${TARGET_SHA}" \
            --data-urlencode "per_page=1")"
          jq -e --arg sha "$TARGET_SHA" '
            [.workflow_runs[] | select(
              .head_sha == $sha and
              .head_branch == "main" and
              .event == "push" and
              .status == "completed" and
              .conclusion == "success"
            )] | length == 1
          ' <<< "$response"

  deploy:
    needs: verify-ci
    if: vars.DEPLOY_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET_SHA: ${{ needs.verify-ci.outputs.target_sha }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_DIR: ${{ secrets.VPS_DIR }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_FINGERPRINT: ${{ secrets.VPS_SSH_FINGERPRINT }}
      VPS_HEALTH_URL: ${{ secrets.VPS_HEALTH_URL }}
      VPS_FPM_SERVICE: ${{ vars.VPS_FPM_SERVICE }}
      VPS_PHP_BINARY: ${{ vars.VPS_PHP_BINARY || '/usr/bin/php' }}
      VPS_ENV_FILE: ${{ secrets.VPS_ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-ci.outputs.target_sha }}
          persist-credentials: false
      - name: Require the GitHub Actions deployment profile
        run: jq -e '.deployment == "github-actions"' cms-project.json
      - name: Validate destination and pin SSH host
        run: |
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]] && ((10#$VPS_PORT > 0 && 10#$VPS_PORT <= 65535))
          [[ "$VPS_DIR" =~ ^/[a-zA-Z0-9_./-]+$ ]] && [ "$VPS_DIR" != / ] && [[ "$VPS_DIR/" != */../* ]]
          [[ "$VPS_PHP_BINARY" =~ ^/[a-zA-Z0-9_./-]+$ ]]
          test -n "$VPS_SSH_KEY" && test -n "$VPS_SSH_FINGERPRINT"
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -T 10 -t ed25519 -p "$VPS_PORT" "$VPS_HOST" > ~/.ssh/known_hosts
          test "$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}' | sort -u)" = "$VPS_SSH_FINGERPRINT"
          echo "RELEASE_NAME=release-$(date -u +%Y%m%d%H%M%S)-${TARGET_SHA}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Build the application locally in the runner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          push: false
          load: true
          tags: dbcms-project:deploy
          cache-from: type=gha,scope=project-rsync
          cache-to: type=gha,mode=max,scope=project-rsync
      - name: Extract the built application directory
        run: |
          container="$(docker create dbcms-project:deploy)"
          trap 'docker rm "$container" >/dev/null' EXIT
          mkdir -p "$RUNNER_TEMP/project-runtime"
          docker cp "$container:/var/www/html/." "$RUNNER_TEMP/project-runtime/"
          rm -f "$RUNNER_TEMP/project-runtime/.env"
          test -f "$RUNNER_TEMP/project-runtime/vendor/autoload.php"
          test -f "$RUNNER_TEMP/project-runtime/public/build/manifest.json"
      - name: Transfer the directory through rsync
        run: |
          printf -v prepare 'mkdir -p %q/releases; test ! -e %q/releases/%q; mkdir %q/releases/%q' "$VPS_DIR" "$VPS_DIR" "$RELEASE_NAME" "$VPS_DIR" "$RELEASE_NAME"
          ssh -p "$VPS_PORT" -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "$prepare"
          rsync -rlptz --delete --chmod=Du=rwx,Dgo=rx,Fu=rwX,Fgo=rX -e "ssh -p $VPS_PORT -o StrictHostKeyChecking=yes" "$RUNNER_TEMP/project-runtime/" "$VPS_USER@$VPS_HOST:$VPS_DIR/releases/$RELEASE_NAME/"
      - name: Bootstrap persistent configuration when explicitly requested
        if: inputs.bootstrap == true
        run: |
          test -n "$VPS_ENV_FILE"
          printf -v bootstrap 'env VPS_DIR=%q bash %q' "$VPS_DIR" "$VPS_DIR/releases/$RELEASE_NAME/bin/vps-bootstrap.sh"
          printf '%s' "$VPS_ENV_FILE" | ssh -p "$VPS_PORT" -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "$bootstrap"
      - name: Promote using the VPS PHP CLI
        run: |
          printf -v remote 'env VPS_DIR=%q RELEASE_NAME=%q VPS_DEPLOYMENT_PROFILE=github-actions VPS_PHP_BINARY=%q VPS_HEALTH_URL=%q VPS_FPM_SERVICE=%q bash %q %q' "$VPS_DIR" "$RELEASE_NAME" "$VPS_PHP_BINARY" "$VPS_HEALTH_URL" "$VPS_FPM_SERVICE" "$VPS_DIR/releases/$RELEASE_NAME/bin/deploy-vps-release.sh" "$VPS_DIR/releases/$RELEASE_NAME"
          ssh -p "$VPS_PORT" -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "$remote"
