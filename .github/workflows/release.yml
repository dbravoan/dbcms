name: Public Release Pipeline

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  quality-gate:
    uses: ./.github/workflows/quality.yml

  build-standalone-zip:
    name: Build Standalone Versioned ZIP
    needs: [quality-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Package Standalone Release Archive
        env:
          RELEASE_VER: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          test "${RELEASE_VER#v}" = "$(tr -d '[:space:]' < VERSION)"
          bash bin/build-release-zip.sh --version="$RELEASE_VER"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: dist/*
          retention-days: 7

  docker-publish:
    name: Build & Verify Docker Image (${{ matrix.arch }})
    needs: [quality-gate]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    env:
      REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Verify immutable image runtime
        id: runtime-smoke
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          IMAGE_DIGEST="${{ steps.build.outputs.digest }}"
          docker run --rm \
            --env APP_ENV=testing \
            --env APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            "${REGISTRY_IMAGE}@${IMAGE_DIGEST}" php artisan --version

      - name: Export image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${IMAGE_DIGEST#sha256:}"

      - name: Upload architecture digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    name: Publish & Verify Multi-Arch Docker Manifest
    needs: [docker-publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Download architecture digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Create and verify multi-architecture manifest
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          cd /tmp/digests
          mapfile -t manifest_tags < <(jq -r '.tags[]' <<< "${DOCKER_METADATA_OUTPUT_JSON}")
          tag_args=()
          for tag in "${manifest_tags[@]}"; do
            tag_args+=("-t" "${tag}")
          done
          digest_args=()
          for digest in *; do
            digest_args+=("${REGISTRY_IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"
          release_tag="$(jq -r '.tags[0]' <<< "${DOCKER_METADATA_OUTPUT_JSON}")"
          docker buildx imagetools inspect "${release_tag}"
          docker buildx imagetools inspect "${release_tag}" --raw > /tmp/manifest.json
          jq -e '[.manifests[].platform.architecture] | index("amd64") != null and index("arm64") != null' /tmp/manifest.json

  create-github-release:
    name: Publish GitHub Release
    needs: [build-standalone-zip, docker-merge]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Built Archives
        uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
