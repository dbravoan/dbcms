name: Public Release Pipeline

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.2)"
        required: true
        default: "1.0.2"
      sha:
        description: "Exact 40-character commit SHA already validated by CI"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  verify-ci:
    name: Verify Exact Main CI
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      target_sha: ${{ steps.release.outputs.target_sha }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout Candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.ref }}
          fetch-depth: 0

      - name: Resolve Immutable Release Identity
        id: release
        env:
          REQUESTED_SHA: ${{ inputs.sha || '' }}
          REQUESTED_VERSION: ${{ inputs.version || '' }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          target_sha="$(git rev-parse 'HEAD^{commit}')"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
            test "$target_sha" = "$REQUESTED_SHA"
            test "$REQUESTED_VERSION" = "$version"
            test "$GITHUB_REF" = "refs/tags/v${version}"
          else
            test "$GITHUB_REF_TYPE" = tag
            test "$GITHUB_REF_NAME" = "v${version}"
            test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = tag
          fi
          echo "target_sha=${target_sha}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Require Successful CI Push For Exact Main Commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.release.outputs.target_sha }}
        run: |
          response="$(curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --get "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            --data-urlencode "branch=main" \
            --data-urlencode "event=push" \
            --data-urlencode "status=success" \
            --data-urlencode "head_sha=${TARGET_SHA}" \
            --data-urlencode "per_page=1")"
          jq -e --arg sha "$TARGET_SHA" '
            [.workflow_runs[] | select(
              .head_sha == $sha and
              .head_branch == "main" and
              .event == "push" and
              .status == "completed" and
              .conclusion == "success"
            )] | length == 1
          ' <<< "$response"

  build-standalone-zip:
    name: Build Standalone Versioned ZIP
    needs: [verify-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-ci.outputs.target_sha }}

      - name: Package Standalone Release Archive
        env:
          RELEASE_VER: ${{ needs.verify-ci.outputs.version }}
        run: |
          test "${RELEASE_VER#v}" = "$(tr -d '[:space:]' < VERSION)"
          bash bin/build-release-zip.sh --version="$RELEASE_VER"
          test -f "dist/dbcms-installer-v${RELEASE_VER}.zip"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: dist/*
          retention-days: 7

  docker-publish:
    name: Build & Verify Docker Image (${{ matrix.arch }})
    needs: [verify-ci]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    env:
      REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

    permissions:
      actions: read
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-ci.outputs.target_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.verify-ci.outputs.version }}

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Verify immutable image runtime
        id: runtime-smoke
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          IMAGE_DIGEST="${{ steps.build.outputs.digest }}"
          docker run --rm \
            --env APP_ENV=testing \
            --env APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            "${REGISTRY_IMAGE}@${IMAGE_DIGEST}" php artisan --version

      - name: Export image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${IMAGE_DIGEST#sha256:}"

      - name: Upload architecture digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    name: Publish & Verify Multi-Arch Docker Manifest
    needs: [verify-ci, docker-publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

    permissions:
      actions: read
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.verify-ci.outputs.version }}
            type=raw,value=latest

      - name: Download architecture digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Create and verify multi-architecture manifest
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          cd /tmp/digests
          mapfile -t manifest_tags < <(jq -r '.tags[]' <<< "${DOCKER_METADATA_OUTPUT_JSON}")
          tag_args=()
          for tag in "${manifest_tags[@]}"; do
            tag_args+=("-t" "${tag}")
          done
          digest_args=()
          for digest in *; do
            digest_args+=("${REGISTRY_IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"
          release_tag="$(jq -r '.tags[0]' <<< "${DOCKER_METADATA_OUTPUT_JSON}")"
          docker buildx imagetools inspect "${release_tag}"
          docker buildx imagetools inspect "${release_tag}" --raw > /tmp/manifest.json
          jq -e '[.manifests[].platform.architecture] | index("amd64") != null and index("arm64") != null' /tmp/manifest.json

  create-github-release:
    name: Publish GitHub Release
    needs: [verify-ci, build-standalone-zip, docker-merge]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-ci.outputs.target_sha }}

      - name: Download Built Archives
        uses: actions/download-artifact@v4
        with:
          name: release-archives
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
          body: |
            ## Descarga este archivo

            Para instalar dbCMS desde Plesk o cPanel sin Composer, Node, Artisan ni SSH, descarga **`dbcms-installer-v${{ needs.verify-ci.outputs.version }}.zip`**. Súbelo, extráelo y abre el dominio para continuar en el navegador.

            El archivo TAR.GZ está destinado a administradores. Los enlaces automáticos **Source code (zip)** y **Source code (tar.gz)** de GitHub contienen únicamente el código fuente para desarrolladores y no son instaladores autónomos.
          append_body: true
          draft: false
          prerelease: false
