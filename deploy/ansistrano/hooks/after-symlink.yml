---
# Hook executed right after the 'current' symlink is updated
- name: Reload PHP-FPM service
  ansible.builtin.service:
    name: "{{ php_fpm_service | default('php8.3-fpm') }}"
    state: reloaded

- name: Restart background queue workers
  ansible.builtin.command: php artisan queue:restart
  args:
    chdir: "{{ ansistrano_release_path.stdout }}"

- name: Verify application healthcheck on /up
  ansible.builtin.uri:
    url: "http://127.0.0.1/up"
    status_code: 200
    timeout: 10
  register: healthcheck
  until: healthcheck.status == 200
  retries: 5
  delay: 2
