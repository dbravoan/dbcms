services:
  app:
    build:
      context: ../..
      dockerfile: docker/production/Dockerfile
      target: ci
      args:
        WITH_CREATIVE_TOOLS: 'true'
    working_dir: /var/www/html
    environment:
      APP_ENV: testing
      DBCMS_TEST_ISOLATED: '1'
      DBCMS_TEST_DATABASE: testing
      DBCMS_TEST_DB_ADMIN_USER: root
      DBCMS_TEST_DB_ADMIN_PASSWORD: ci-only-password
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: testing
      DB_USERNAME: sail
      DB_PASSWORD: secret
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      REDIS_HOST: redis
    volumes:
      - ../../dist:/var/www/html/dist
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
  mysql:
    image: mysql:8.0
    # The quality database is disposable. Keep repeated migrate:fresh DDL off
    # the host disk; this mount never applies to Sail or production MySQL.
    tmpfs:
      - /var/lib/mysql
    environment:
      MYSQL_DATABASE: testing
      MYSQL_USER: sail
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: ci-only-password
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --connect-timeout=2 --batch --skip-column-names --execute="SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20
