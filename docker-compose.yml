x-marketing-worker: &marketing-worker
    image: sail-8.3/app
    restart: unless-stopped
    stop_grace_period: 1500s
    extra_hosts:
        - 'host.docker.internal:host-gateway'
    environment:
        WWWUSER: '${WWWUSER:-1000}'
        SUPERVISOR_PHP_USER: sail
        LARAVEL_SAIL: 1
        INSIDE_CONTAINER: "true"
    volumes:
        - '.:/var/www/html'
    networks:
        - sail
    depends_on:
        mysql:
            condition: service_healthy
        redis:
            condition: service_healthy

services:
    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.3
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: sail-8.3/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            INSIDE_CONTAINER: "true"
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy

    mysql:
        image: 'mysql/mysql-server:8.0'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-secret}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE:-laravel}'
            MYSQL_USER: '${DB_USERNAME:-sail}'
            MYSQL_PASSWORD: '${DB_PASSWORD:-secret}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './docker/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD:-secret}'
            retries: 3
            timeout: 5s

    redis:
        profiles: [redis, creative, social]
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s

    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail

    adminer:
        image: 'adminer:latest'
        ports:
            - '${FORWARD_ADMINER_PORT:-8088}:8080'
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy

    creative-generation:
        <<: *marketing-worker
        profiles: [creative]
        command: php artisan queue:work marketing --queue=creative-generation --sleep=2 --tries=1 --timeout=720

    creative-render:
        <<: *marketing-worker
        profiles: [creative]
        command: php artisan queue:work marketing --queue=creative-render --sleep=2 --tries=1 --timeout=300

    social-delivery:
        <<: *marketing-worker
        profiles: [social]
        command: php artisan queue:work marketing --queue=social-delivery --sleep=2 --tries=1 --timeout=600

    social-reconciliation:
        <<: *marketing-worker
        profiles: [social]
        command: php artisan queue:work marketing --queue=social-reconciliation --sleep=3 --tries=1 --timeout=180

    scheduler:
        <<: *marketing-worker
        profiles: [workers, creative, social]
        depends_on:
            mysql:
                condition: service_healthy
        command: php artisan schedule:work

    queue:
        profiles: [workers, creative, social]
        image: sail-8.3/app
        restart: unless-stopped
        command: php artisan queue:work --sleep=1 --tries=1 --timeout=1200
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            INSIDE_CONTAINER: "true"
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy

networks:
    sail:
        driver: bridge

volumes:
    sail-mysql:
        driver: local
    sail-redis:
        driver: local
