services:
  app:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
    image: "${CMS_IMAGE:-ghcr.io/dbravoan/dbcms:latest}"
    restart: unless-stopped
    stop_grace_period: 1500s
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      APP_ENV: production
      APP_NAME: "${APP_NAME:-dbCMS}"
      CMS_BRAND: "${CMS_BRAND:-dbcms}"
      CMS_THEME: "${CMS_THEME:-db-cyber}"
      ADMIN_PATH: "${ADMIN_PATH:-admin}"
      CMS_INSTALLATION_ID: "${CMS_INSTALLATION_ID:-}"
      MARKETING_MAX_ARTIFACT_BYTES: "${MARKETING_MAX_ARTIFACT_BYTES:-536870912}"
      MARKETING_GENERATION_CONCURRENCY: "${MARKETING_GENERATION_CONCURRENCY:-2}"
      GEO_SITE_NAME: "${GEO_SITE_NAME:-dbCMS Platform}"
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:?APP_KEY is required and must remain stable}"
      APP_URL: "${APP_URL:-http://localhost}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-dbcms}"
      DB_USERNAME: "${DB_USERNAME:-dbcms}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      SESSION_DRIVER: "${SESSION_DRIVER:-file}"
      SESSION_ENCRYPT: "true"
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-true}"
      CACHE_STORE: "${CACHE_STORE:-file}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
      REDIS_QUEUE_RETRY_AFTER: "${REDIS_QUEUE_RETRY_AFTER:-1500}"
      DB_QUEUE_RETRY_AFTER: "${DB_QUEUE_RETRY_AFTER:-1500}"
      MAIL_MAILER: "${MAIL_MAILER:-log}"
      MAIL_HOST: "${MAIL_HOST:-localhost}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_SCHEME: "${MAIL_SCHEME:-smtp}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-hello@example.com}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-dbCMS}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-false}"
    volumes:
      - app_storage:/var/www/html/storage
      - app_uploads:/var/www/html/public/uploads
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-dbcms}"
      MYSQL_USER: "${DB_USERNAME:-dbcms}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1 --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}" --connect-timeout=2 --batch --skip-column-names --execute="SELECT 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    profiles: [redis]
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app_storage:
  app_uploads:
  mysql_data:
  redis_data:
